{% extends 'main/layout.html' %}
{%block  title  %}{% endblock  %}
{% block content %}
    <div class="task_update">
        {% if request.user == task.author %}
            <from method ="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type"submit" class="btn btn-primary">Save</button>
            </from>
        
            <a href="{% url 'task_delete' task.slug %}">Delete</a>
        {% endif %}
    </div>
{% endblock %}
